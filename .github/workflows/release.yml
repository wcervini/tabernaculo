name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: tabernaculo-linux-x64
          - target: bun-linux-arm64
            asset: tabernaculo-linux-arm64
          - target: bun-darwin-x64
            asset: tabernaculo-darwin-x64
          - target: bun-darwin-arm64
            asset: tabernaculo-darwin-arm64
          - target: bun-windows-x64
            asset: tabernaculo-windows-x64.exe
          - target: bun-windows-arm64
            asset: tabernaculo-windows-arm64.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build standalone binary
        run: |
          set -e
          bun build --compile --target=${{ matrix.target }} --outfile tabernaculo src/main.ts
          # Bun appends .exe automatically for Windows targets
          if [ -f tabernaculo.exe ]; then mv tabernaculo.exe ${{ matrix.asset }}; else mv tabernaculo ${{ matrix.asset }}; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
